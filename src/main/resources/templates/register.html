<form method="post" th:action="@{/register}">
    <h2 th:text="#{register}"></h2>

    <label for="username" th:text="#{username}"></label>
    <input type="text"
           name="username"
           id="username"
           th:placeholder="#{username}"/>

    <label for="password" th:text="#{password}"></label>
    <input type="password"
           name="password"
           id="password"
           th:placeholder="#{password}"/>

    <button th:text="#{register}"></button>
</form>
