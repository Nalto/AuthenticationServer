<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login}"></title>
</head>
<body>
    <form method="post" th:action="@{/login}">
        <h2 th:text="#{login}"></h2>

        <label for="username" th:text="#{username}"></label>
        <input type="text"
               name="username"
               id="username"
               th:placeholder="#{username}"/>

        <label for="password" th:text="#{password}"></label>
        <input type="password"
               name="password"
               id="password"
               th:placeholder="#{password}"/>

        <button th:text="#{login}"></button>

        <a th:href="@{/register}" th:text="#{login}"></a>
    </form>
</body>
</html>
